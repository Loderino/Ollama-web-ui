[project]
name = "Ollama-web-ui"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Kirill Savostin", email = "savostn.c@yandex.ru" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "celery>=5.7.0",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "N", "RUF"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
